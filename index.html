<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>İyi ki Doğdun Şura!</title>
    <!-- PWA / Mobil Tam Ekran Desteği -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            text-align: center;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            padding: 30px 20px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            max-width: 380px;
            width: 100%;
            position: relative;
            z-index: 10;
            animation: bounceIn 1s ease;
        }
        .cat-box {
            font-size: 70px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: transform 0.2s;
            display: inline-block;
        }
        .cat-box:active {
            transform: scale(1.2) rotate(10deg);
        }
        h1 {
            color: #ff477e;
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 5px;
        }
        .age-badge {
            background: #ff477e;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 15px;
        }
        p {
            color: #555;
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        .touch-btn {
            background: linear-gradient(45deg, #ff477e, #ff7096);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 71, 126, 0.4);
            transition: transform 0.1s, box-shadow 0.1s;
            width: 100%;
        }
        .touch-btn:active {
            transform: scale(0.95);
            box-shadow: 0 2px 8px rgba(255, 71, 126, 0.4);
        }
        /* Konfeti Parçacıkları */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #ffd700;
            top: -10px;
            opacity: 0.8;
            animation: fall linear forwards;
            z-index: 1;
        }
        @keyframes fall {
            to {
                transform: translateY(105vh) rotate(720deg);
                opacity: 0;
            }
        }
        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="cat-box" id="catEmoji">🐱🎂</div>
        <h1>İyi ki Doğdun Şura!</h1>
        <div class="age-badge">13 Yaşında! ✨</div>
        <p>Yeni yaşın sana mutluluk, başarı ve tatlı anlar getirsin! Kedili ve neşeli günlerin hiç eksik olmasın. Dokun ve kutlamayı başlat! 🎉</p>
        <button class="touch-btn" onclick="celebrate()">Sürprizi Patlat! 🎈</button>
    </div>

    <script>
        // Kediye tıklayınca miyav efekti veya hareket
        const cat = document.getElementById('catEmoji');
        const cats = ['🐱🎂', '😺🎉', '😻💖', '😽🎈', '😸✨'];
        let catIndex = 0;

        cat.addEventListener('click', () => {
            catIndex = (catIndex + 1) % cats.length;
            cat.textContent = cats[catIndex];
            createConfettiBurst();
        });

        function celebrate() {
            createConfettiBurst();
            // Titreşim desteği (Telefon destekliyorsa dokunulduğunda titrer)
            if (navigator.vibrate) {
                navigator.vibrate([100, 50, 100]);
            }
        }

        function createConfettiBurst() {
            for (let i = 0; i < 40; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = ['#ff477e', '#ffd700', '#00f2fe', '#4facfe', '#fa709a'][Math.floor(Math.random() * 5)];
                confetti.style.animationDuration = (Math.random() * 2 + 1) + 's';
                confetti.style.width = (Math.random() * 8 + 6) + 'px';
                confetti.style.height = confetti.style.width;
                document.body.appendChild(confetti);

                setTimeout(() => {
                    confetti.remove();
                }, 3000);
            }
        }

        // Sayfa açıldığında otomatik küçük bir konfetti
        window.onload = () => {
            setTimeout(createConfettiBurst, 500);
        };
    </script>
</body>
</html>
